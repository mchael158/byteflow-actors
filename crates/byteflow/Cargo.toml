[package]
name = "byteflow-actors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/mchael158/bytecode-vm"
documentation = "https://docs.rs/byteflow-actors"
description = "Embeddable flow runtime: M:N scheduler, Atomic Hop (Message+Cap), supervisor — use byteflow::"
readme = "README.md"
keywords = ["flows", "bytecode", "vm", "concurrency", "embedded"]
categories = ["concurrency", "emulators"]
include = [
    "src/**/*",
    "examples/**/*",
    "docs/**/*",
    "tests/**/*",
    "README.md",
    "CHANGELOG.md",
    "Cargo.toml",
    "LICENSE*",
]
# Package on crates.io is `byteflow-actors` (`byteflow` is taken).
# Library crate name stays `byteflow` → dependents write `use byteflow::...`.
[lib]
name = "byteflow"
path = "src/lib.rs"

[[bin]]
name = "byteflow"
path = "src/bin/byteflow.rs"
doc = false

[[example]]
name = "jit_loop"
path = "examples/jit_loop.rs"
required-features = ["jit"]

[dependencies]
cranelift-codegen = { version = "0.135.1", optional = true }
cranelift-frontend = { version = "0.135.1", optional = true }
cranelift-jit = { version = "0.135.1", optional = true }
cranelift-module = { version = "0.135.1", optional = true }
cranelift-native = { version = "0.135.1", optional = true }

[features]
jit = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Clippy otherwise suggests converting `match` into unwrap_or / unwrap_or_default.
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
