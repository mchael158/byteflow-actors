[package]
name = "byteflow-io"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Host-side I/O integration layer for the Byteflow runtime"
repository = "https://github.com/mchael158/byteflow-io"
homepage = "https://github.com/mchael158/byteflow-io"
documentation = "https://docs.rs/byteflow-io"
readme = "README.md"
keywords = ["byteflow", "embedded", "io", "host-await", "runtime"]
categories = ["concurrency", "embedded", "api-bindings"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "README.md",
    "ARCHITECTURE.md",
    "Cargo.toml",
    "LICENSE*",
    "rust-toolchain.toml",
]

[dependencies]
# Workspace: always compile against local core HEAD. `version` is for crates.io publish only.
byteflow-actors = { path = "../byteflow", version = "0.9.21" }

[dev-dependencies]

[features]
default = []
