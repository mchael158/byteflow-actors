[workspace]
resolver = "2"
members = ["crates/byteflow"]

[workspace.package]
version = "0.9.7"
edition = "2021"
authors = ["Byteflow Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mchael158/bytecode-vm"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false

[profile.bench]
inherits = "release"