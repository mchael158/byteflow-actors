name: Bug report
description: Something crashed, hung, or gave the wrong answer.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A short Rust program using `Program` / `Runtime` is ideal, or a `.bf` module.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: byteflow version
      placeholder: "byteflow --version, or the version in Cargo.toml"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Rust version
      placeholder: "Ubuntu 24.04, rustc 1.99.1"
