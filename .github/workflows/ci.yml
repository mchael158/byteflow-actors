# Hermetic CI: fetch once online, then build/test offline against Cargo.lock.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · benches · docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch locked deps (online)
        run: cargo fetch --locked

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (std)
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Clippy (jit)
        run: cargo clippy --workspace --all-targets --features jit --locked --offline -- -D warnings

      - name: Test (std)
        run: cargo test --workspace --locked --offline

      - name: Examples (std)
        run: cargo build --examples --locked --offline

      - name: Test (jit)
        run: cargo test --workspace --features jit --locked --offline

      - name: Examples (jit)
        run: cargo build --examples --features jit --locked --offline

      - name: Compile Criterion benches
        run: cargo bench --workspace --no-run --locked --offline

      - name: Rustdoc
        run: cargo doc --workspace --all-features --no-deps --locked --offline
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.88 (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `+1.88` overrides rust-toolchain.toml, which pins the dev toolchain.
      - name: Check (all targets)
        run: cargo +1.88 check --workspace --all-targets --locked

      - name: Test (std)
        run: cargo +1.88 test --workspace --locked

  platforms:
    name: test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: "1.99.1"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test (std)
        run: cargo test --workspace --locked

      - name: CLI smoke test
        shell: bash
        run: |
          cargo run --locked --bin byteflow -- demo ping-pong
          cargo run --locked --bin byteflow -- pack ping-pong target/ping_pong.bf
          cargo run --locked --bin byteflow -- verify target/ping_pong.bf
          cargo run --locked --example untrusted
