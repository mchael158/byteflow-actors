# Hermetic CI: fetch once online, then build/test offline against Cargo.lock.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch locked deps (online)
        run: cargo fetch --locked

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (std)
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Clippy (jit)
        run: cargo clippy --workspace --all-targets --features jit --locked --offline -- -D warnings

      - name: Test (std)
        run: cargo test --workspace --locked --offline

      - name: Test (jit)
        run: cargo test --workspace --features jit --locked --offline

      - name: Compile Criterion benches
        run: cargo bench --workspace --no-run --locked --offline
