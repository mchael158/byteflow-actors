# Hermetic CI: fetch once online, then build/test offline against Cargo.lock.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@be73d7920c329f220ce78e0234b8f96b7fe81347 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f13886bd2223a4162dba51f84607e71ccd291ea9 # v2.8.0

      - name: Fetch locked deps (online)
        run: cargo fetch --locked

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (std)
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Clippy (jit)
        run: cargo clippy --workspace --all-targets --features jit --locked --offline -- -D warnings

      - name: Test (std)
        run: cargo test --workspace --locked --offline

      - name: Test (jit)
        run: cargo test --workspace --features jit --locked --offline

      - name: Compile Criterion benches
        run: cargo bench --workspace --no-run --locked --offline
